name: Preise und Angebote aktualisieren

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1'   # montags frueh: neue Prospektwoche
    - cron: '30 3 * * 4'   # donnerstags frueh: Wochenend-Angebote
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: preise
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preise und Angebote holen
        if: github.event_name != 'push'
        run: |
          pip install -r scripts/requirements.txt
          python scripts/preise_holen.py

      - name: Daten speichern
        if: github.event_name != 'push'
        run: |
          git config user.name "wochenkorb-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten/preise.json
          git diff --cached --quiet || (git commit -m "Preise und Angebote $(date +%F)" && git push)

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site/daten
          cp index.html manifest.webmanifest sw.js _site/
          cp -r icons _site/
          cp daten/preise.json _site/daten/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
