<title>Wochenkorb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: links der Zettel (Ladenwahl, Eingabe, Tour mit Stationen, Posten nach Laufweg), rechts der Kassenbon als Papierstreifen; mobil gestapelt mit fester Summenleiste unten */
:root{
  --bg:#edf1ef; --surface:#ffffff; --surface-2:#f4f7f5; --ink:#15201c; --muted:#5a6964; --line:#d7dfdb;
  --accent:#0b6b5d; --accent-ink:#ffffff; --accent-soft:#d9eee8;
  --tag:#ffd84a; --tag-ink:#241b00; --deal:#c42b2b; --deal-ink:#ffffff; --good:#157a3c;
  --paper:#fffefa; --paper-ink:#262621; --paper-line:#cfcabb;
  --shadow:0 12px 32px rgb(15 30 25 / .16);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1412; --surface:#161f1c; --surface-2:#1c2723; --ink:#e6eeea; --muted:#97a8a1; --line:#2a3732;
    --accent:#43bba2; --accent-ink:#05201a; --accent-soft:#173b33;
    --tag:#f4cd3a; --tag-ink:#1f1700; --deal:#ff7a70; --deal-ink:#2b0503; --good:#56d98a;
    --paper:#1d2522; --paper-ink:#e2e8e4; --paper-line:#3a4641;
    --shadow:0 12px 32px rgb(0 0 0 / .5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#161f1c; --surface-2:#1c2723; --ink:#e6eeea; --muted:#97a8a1; --line:#2a3732;
  --accent:#43bba2; --accent-ink:#05201a; --accent-soft:#173b33;
  --tag:#f4cd3a; --tag-ink:#1f1700; --deal:#ff7a70; --deal-ink:#2b0503; --good:#56d98a;
  --paper:#1d2522; --paper-ink:#e2e8e4; --paper-line:#3a4641;
  --shadow:0 12px 32px rgb(0 0 0 / .5);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.app{max-width:1140px;margin:0 auto;padding-inline:16px;padding-block:12px 128px}
@media (min-width:900px){.app{padding-block:20px 48px}}

/* Kopf */
.kopf{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding-block:4px 8px}
.marke{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
h1{font:800 32px/1 var(--f-display);letter-spacing:.02em;margin:0;text-transform:uppercase}
.kw{margin:3px 0 0;color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.konto::before{background:var(--good)}
.sync.fehler::before{background:var(--deal)}

/* Reiter */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:6px;background:var(--bg);padding-block:8px;margin-bottom:6px;overflow-x:auto;scrollbar-width:none}
.tab{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .zahl{font:600 12px var(--f-mono);background:var(--tag);color:var(--tag-ink);border-radius:999px;padding:0 6px;min-width:20px}
@media (max-width:460px){.tab{flex:1 1 auto;padding:8px 10px;font-size:14px;gap:4px}.tabs{gap:4px}}

/* Liste-Layout */
.liste-layout{display:grid;gap:24px;align-items:start}
@media (min-width:900px){.liste-layout{grid-template-columns:minmax(0,1fr) 350px}}
.zettel{min-width:0}
h2{font:700 20px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin:0}
.abschnitt-kopf{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-block:10px 8px}
.klein{font-size:13px;color:var(--muted)}

/* Ladenwahl */
.wahl{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;min-width:0}
.chip .n{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;white-space:nowrap}
.chip .b{font:600 16px var(--f-mono);font-variant-numeric:tabular-nums}
.chip .u{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip .u.gut{color:var(--good);font-weight:600}
.chip .u.fehlt{color:var(--deal)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.chip.kombi .n{color:var(--accent)}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.dot.stern{background:none;width:12px;height:12px;color:var(--accent)}

/* Eingabe */
.suche{position:relative;margin-block:16px 4px}
.suche > svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.suche input{width:100%;padding:14px 14px 14px 46px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px}
.suche input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.vorschlaege{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:30;max-height:380px;overflow:auto;padding:4px}
.vs{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:none;text-align:left;border-radius:8px}
.vs[aria-selected="true"],.vs:hover{background:var(--surface-2)}
.vs .vs-n{min-width:0}
.vs .vs-n small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.vs .vs-p{font:500 14px var(--f-mono);white-space:nowrap;text-align:right}
.vs .vs-p small{display:block;font:400 12px var(--f-body);color:var(--muted)}
.vs.eigen .vs-n{color:var(--accent);font-weight:600}
.eingabe-tipp{font-size:13px;color:var(--muted);margin:0 0 4px}

/* Tour */
.tour-kopf{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:22px}
.tour-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tour-tabs button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.tour-tabs button b{font:800 16px/1 var(--f-display)}
.tour-tabs button small{font:500 12px var(--f-mono);color:var(--muted)}
.tour-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tour-tabs button[aria-pressed="true"] small{color:inherit;opacity:.8}
.station{margin-top:22px}
.station-kopf{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.nr{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:800 19px/1 var(--f-display);flex:none}
.station.erledigt .nr{background:var(--accent);color:var(--accent-ink)}
.st-titel{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px}
.st-titel strong{font:700 23px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;display:inline-flex;align-items:center;gap:6px}
.st-titel .klein{width:100%}
.st-akt{display:flex;gap:4px;align-items:center;flex:none}
.st-balken{height:5px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.st-balken i{display:block;height:100%;background:var(--accent);border-radius:3px}
.laufweg-zeile{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:18px;font-size:14px;color:var(--muted)}
.laufweg-zeile strong{color:var(--ink)}
.knopf.klein-k{padding:5px 10px;font-size:13px}

/* Posten */
.gang{margin-top:16px}
.gang-kopf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 2px 6px;font:700 13px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.gang-kopf .gl{display:flex;align-items:center;gap:8px}
.gang-kopf .gs{font:500 13px var(--f-mono);letter-spacing:0;text-transform:none}
.gnr{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font:600 12px var(--f-mono);letter-spacing:0}
.posten{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pos{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.pos:first-child{border-top:0}
.pos.offen{background:var(--surface-2)}
.haken{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;color:transparent;padding:0}
.haken:hover{border-color:var(--accent)}
.pos.ok .haken{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pos.ok .name{text-decoration:line-through;color:var(--muted)}
.pos.ok .preis{color:var(--muted)}
.txt{border:0;background:none;padding:2px 0;margin:0;text-align:left;min-width:0;width:100%;display:block;border-radius:6px}
.name{display:block;font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center;margin-top:2px}
.fest{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--ink)}
.tipp{color:var(--good);font-weight:600}
.fehlt{color:var(--deal);font-weight:600}
.tag{background:var(--tag);color:var(--tag-ink);font-weight:700;font-size:12px;padding:1px 6px;border-radius:4px}
.rechts{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.preis{border:0;background:none;padding:2px 4px;margin:-2px -4px;border-radius:6px;font:600 16px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
button.preis:hover{background:var(--surface-2)}
.preis s{display:block;font-size:12px;color:var(--muted);font-weight:400}
.preis.offen{color:var(--accent);font-family:var(--f-body)}
.preis-edit{width:88px;padding:6px 8px;border:1.5px solid var(--accent);border-radius:8px;background:var(--surface);font:600 15px var(--f-mono);text-align:right}
.menge{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.menge button{width:32px;height:30px;border:0;background:none;font-size:18px;line-height:1;display:grid;place-items:center;border-radius:999px;color:var(--ink)}
.menge button:hover{background:var(--surface-2)}
.menge span{min-width:18px;text-align:center;font:600 14px var(--f-mono)}
.details{grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.details-akt{grid-column:1 / -1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.leer{background:var(--surface);border:1.5px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted);margin-top:18px}
.leer strong{display:block;color:var(--ink);font:700 22px var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.aktionen{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.knopf{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.knopf:hover{border-color:var(--accent)}
.knopf.haupt{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.knopf.warn{color:var(--deal)}
.knopf.warn[data-sicher="1"]{background:var(--deal);color:var(--deal-ink);border-color:var(--deal)}
.kopiertext{width:100%;min-height:140px;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);font:13px var(--f-mono)}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin-block:6px 4px;font-size:14px}
.banner .aktionen{margin:0}

/* Kassenbon */
.bon{background:var(--paper);color:var(--paper-ink);font:400 13.5px/1.55 var(--f-mono);font-variant-numeric:tabular-nums;padding:22px 20px 34px;
  --zz:9px;-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/calc(2*var(--zz)) 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/calc(2*var(--zz)) 100%;
  border-radius:3px 3px 0 0;scroll-margin-top:70px}
@media (min-width:900px){.bon{position:sticky;top:70px}}
.bon-kopf{text-align:center;margin-bottom:10px}
.bon-kopf strong{display:block;font:800 26px/1 var(--f-display);letter-spacing:.14em}
.bon-kopf span{font-size:12px;letter-spacing:.06em}
.bon hr{border:0;border-top:1.5px dashed var(--paper-line);margin:10px 0}
.z{display:flex;justify-content:space-between;gap:12px}
.z > span:last-child{text-align:right}
.z.gespart{color:var(--good)}
.z.klein{font-size:12.5px;opacity:.85}
.summe{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:2px solid var(--paper-ink);border-bottom:2px solid var(--paper-ink);padding:8px 0;margin:10px 0 8px;font-weight:600}
.summe b{font:800 30px/1 var(--f-display);letter-spacing:.02em}
.bon h4{margin:4px 0 8px;font:600 12px var(--f-mono);letter-spacing:.14em}
.vg{display:grid;grid-template-columns:74px minmax(0,1fr) 62px;gap:8px;align-items:center;width:100%;border:0;background:none;padding:3px 4px;margin:0 -4px;border-radius:4px;text-align:left;color:inherit;font:inherit}
.vg:hover{background:rgb(127 127 127 / .12)}
.vg[aria-pressed="true"]{outline:1.5px solid var(--paper-ink)}
.vg .vn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vg .vb{text-align:right}
.balken{height:10px;background:rgb(127 127 127 / .14);border-radius:2px;overflow:hidden}
.balken i{display:block;height:100%;border-radius:2px}
.balken i.teil{background-image:repeating-linear-gradient(45deg,rgb(255 255 255 / .55) 0 3px,transparent 3px 6px)}
.vg-notiz{grid-column:2 / -1;font-size:11.5px;margin-top:-2px}
.vg-notiz.gut{color:var(--good);font-weight:600}
.vg-notiz.fehlt{color:var(--deal)}
.kombi-box{margin-top:12px;padding:10px;border:1.5px dashed var(--paper-line);font-size:12.5px}
.kombi-box b{font-weight:600}
.bon-fuss{margin-top:14px;font-size:11.5px;text-align:center;opacity:.75}

/* Summenleiste mobil */
.leiste{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);box-shadow:0 -6px 20px rgb(0 0 0 / .18)}
.leiste .lb{font:800 28px/1 var(--f-display)}
.leiste .ll{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
.leiste .lo{flex:1;min-width:0;font-size:13px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leiste button{border:0;background:var(--tag);color:var(--tag-ink);font-weight:700;border-radius:999px;padding:8px 14px;flex:none}
.leiste .l-teilen{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--bg);border:1.5px solid currentColor;opacity:.9}
.leiste .l-teilen svg{width:20px;height:20px}
@media (min-width:900px){.leiste{display:none}}

/* Bereiche: Angebote, Preise, Laeden */
.bereich{display:grid;gap:16px;min-width:0}
.info{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:15px}
.info p{margin:0 0 8px;max-width:70ch}
.info p:last-child{margin-bottom:0}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.links a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;text-decoration:none;color:var(--ink);background:var(--surface-2)}
.links a:hover{border-color:var(--accent)}
.formular{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.formular summary{padding:12px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.formular summary::-webkit-details-marker{display:none}
.formular summary::after{content:"+";font:600 22px/1 var(--f-mono);color:var(--accent)}
.formular[open] summary::after{content:"–"}
.felder{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:0 16px 16px}
.feld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.feld.breit{grid-column:1 / -1}
.feld input,.feld select,.filterzeile input,.filterzeile select{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px;font-weight:400;color:var(--ink);min-width:0;width:100%}
.feld input:focus,.feld select:focus,.filterzeile input:focus,.filterzeile select:focus{border-color:var(--accent);outline:none}
.felder .knopf{align-self:end;padding:11px 16px}
.fehlermeldung{grid-column:1 / -1;color:var(--deal);font-size:14px;margin:0}
.filterzeile{display:flex;flex-wrap:wrap;gap:8px}
.filterzeile > *{flex:1 1 180px}
.filter{display:flex;flex-wrap:wrap;gap:6px}
.filter button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.angebote{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.schild{background:var(--tag);color:var(--tag-ink);border-radius:10px;padding:12px 14px 12px;display:flex;flex-direction:column;gap:4px;position:relative;min-width:0}
.schild.eigen{box-shadow:inset 0 0 0 2px var(--tag-ink)}
.s-kopf{display:flex;align-items:center;gap:6px;font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.08em;padding-right:64px}
.s-kopf .bsp{font-weight:600;letter-spacing:.04em;border:1px solid currentColor;border-radius:4px;padding:0 4px;font-size:10.5px;opacity:.75}
.rabatt{position:absolute;top:10px;right:10px;background:var(--deal);color:var(--deal-ink);font:800 17px/1 var(--f-display);padding:4px 8px;border-radius:6px;transform:rotate(3deg)}
.pn{font-weight:600;line-height:1.25;overflow-wrap:anywhere;margin-top:2px}
.pn small{display:block;font-weight:400;font-size:13px;opacity:.8}
.s-preis{display:flex;align-items:flex-end;gap:10px;margin-top:2px}
.gross{font:800 44px/.9 var(--f-display);letter-spacing:-.01em}
.gross sup{font-size:.5em;vertical-align:.75em;margin-left:1px}
.s-preis s{font:500 14px var(--f-mono);opacity:.75;padding-bottom:4px}
.s-fuss{font-size:13px;opacity:.85}
.s-fuss a{color:inherit}
.zelle.echt::after{content:"✓";font:700 10px var(--f-body);color:var(--good);margin-left:2px;vertical-align:super}
.zelle.bon::after{content:"B";font:800 9px var(--f-body);color:var(--accent-ink);background:var(--accent);border-radius:3px;padding:0 2px;margin-left:3px;vertical-align:super}
.s-akt{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}

function gattungVon(t){ // auch mit einem Tippfehler: "kaffe" -> Kaffee
  const l = locker(t);

  const k = Object.keys(GATTUNG_LOCKER).find(x => x.length >= 5 && einAbstand(l, x));

function einAbstand(a, b){ // hoechstens ein Tippfehler (ersetzt, fehlt, zu viel, vertauscht)?

}

function wortWert(a, b){
  if (a === b) return 100;

  if (a.length >= 2 && b.startsWith(a)) return 60;

}

  const ix = suchIndex(p);

  for (const {t, l, gang, gid} of woerter){
    let best = 0;
    for (const w of ix.name){ const v = wortWert(l, w); best = Math.max(best, v + (w === ix.letztes && v >= 85 ? 5 : 0)); }

}
function suche(text, max = 8){

    .sort((a, b) => (b.wert - a.wert) || (a.p.name.length - b.p.name.length) || (a.p.idx - b.p.idx))

function regulaer(pid, lid){ const o = state.preise[pid]; if (o && o[lid] != null) return o[lid]; return SCHAETZ[pid] ? SCHAETZ[pid][lid] : null; }

    const moeglich = LAEDEN.filter(l => regulaer(p.id, l.id) != null);
    const l = moeglich[Math.floor(rnd() * moeglich.length)];
    const alt = regulaer(p.id, l.id), preis = rund(alt * (1 - (0.18 + rnd() * 0.24)));
    if (preis >= alt) continue;
    out.push({id: 'bsp-' + p.id + '-' + l.id, laden: l.id, pid: p.id, name: p.name, einheit: p.einheit, preis, alt, bis: SAMSTAG_STR, beispiel: true});

    return {preis: nimmAng ? ang.preis : r, reg: r, ang: nimmAng ? ang : null, pfand: PMAP[it.pid].pfand};
  }
  if (ang){ const reg = it.preis ?? ang.alt ?? ang.preis; return {preis: Math.min(ang.preis, reg), reg, ang: ang.preis < reg ? ang : null, pfand: 0}; }

function rechne(ls){

    if (fl){ r.fest++; const p = posten(it, fl); bl = fl; bp = p.fehlt ? {preis: 0, reg: 0, ang: null, pfand: 0, ohne: true, nv: true} : p; }
    else { let bv = Infinity; for (const l of ls){ const p = posten(it, l); if (p.fehlt) continue; const v = p.preis + p.pfand; if (v < bv - 1e-9){ bv = v; bl = l; bp = p; } } }

  return best && jetzt - best.v >= 0.10 ? best : null;
}
let R = null, VERGLEICH = [], KOMBI = null;
function berechneAlles(){
  if (state.modus !== 'kombi' && !state.aktiv.includes(state.modus)) state.modus = 'kombi';
  angeboteNeu();
  VERGLEICH = state.aktiv.map(l => ({l, r: rechne([l])})).sort((a, b) => (a.r.fehlt.length - b.r.fehlt.length) || (a.r.summe - b.r.summe));
  KOMBI = besteKombi();
  R = state.modus === 'kombi' ? KOMBI : VERGLEICH.find(v => v.l === state.modus).r;
}

const summeVon = items => items.reduce((s, it) => { const z = R.zu[it.id]; return s + (z ? (z.p.preis + z.p.pfand) * it.menge : 0); }, 0);

// Artikel eines Ladens nach seinem Laufweg in Gaenge gruppiert
function gaengeHTML(items, lid){
  const folge = gangfolge(lid), gruppen = new Map();
  for (const it of items){ const k = katVon(it); if (!gruppen.has(k)) gruppen.set(k, []); gruppen.get(k).push(it); }
  return [...gruppen.entries()].sort((a, b) => folge.indexOf(a[0]) - folge.indexOf(b[0])).map(([k, its], i) => {
    its.sort((a, b) => a.ok - b.ok);
    return `<div class="gang"><div class="gang-kopf"><span class="gl"><span class="gnr">${i + 1}</span>${esc(k)}</span><span class="gs">${its.length} · ${euro(summeVon(its))}</span></div><ul class="posten">${its.map(zeileHTML).join('')}</ul></div>`;
  }).join('');
}

let zug = null;
document.addEventListener('pointerdown', e => {
  const g = e.target.closest && e.target.closest('.griff');
  if (!g) return;
  e.preventDefault();
  const li = g.closest('li');
  zug = {li, liste: li.parentElement};
  li.classList.add('zieht');
  try { g.setPointerCapture(e.pointerId); } catch (x) {}
});
document.addEventListener('pointermove', e => {
  if (!zug) return;
  for (const anderes of zug.liste.children){
    if (anderes === zug.li) continue;
    const b = anderes.getBoundingClientRect();
    if (e.clientY < b.top || e.clientY > b.bottom) continue;
    if (e.clientY < b.top + b.height / 2){ if (anderes.previousElementSibling !== zug.li) zug.liste.insertBefore(zug.li, anderes); }
    else if (anderes.nextElementSibling !== zug.li) zug.liste.insertBefore(zug.li, anderes.nextElementSibling);
    break;
  }
});
function zugEnde(){
  if (!zug) return;
  const folge = [...zug.liste.children].map(li => li.dataset.kat);
  zug.li.classList.remove('zieht'); zug = null;
  setzeGangfolge(lwLaden, folge);
}
document.addEventListener('pointerup', zugEnde);
document.addEventListener('pointercancel', zugEnde);

let vsTreffer = [], vsIndex = 0;
const TRENNER = /[,;\n]/;
function zerlege(q){ const m = q.trim().match(/^(\d{1,2})\s*(?:x|×|stk\.?|stück)?\s+(.+)$/i); return m ? {menge: Math.max(1, +m[1]), text: m[2].trim()} : {menge: 1, text: q.trim()}; }
function preisHinweis(pid){
  const it = {pid, name: PMAP[pid].name};
  let best = null;
  for (const l of state.aktiv){ const p = posten(it, l); if (p.fehlt) continue; if (!best || p.preis < best.p.preis) best = {l, p}; }
  return best;
}
function zeigeVorschlaege(){
  const ein = $('#eingabe'); if (!ein) return;
  if (TRENNER.test(ein.value)){
    const teile = ein.value.split(/[,;\n]+/).map(s => s.trim()).filter(Boolean);
    vsTreffer = teile.length ? [{typ: 'mehrere', teile}] : [];
    vsIndex = 0;
    if (vsTreffer.length) zeichneVorschlaege(); else schliesseVorschlaege();
    return;
  }
  const {text} = zerlege(ein.value);
  if (!text){ schliesseVorschlaege(); return; }
  const gefunden = suche(text, 10);
  vsTreffer = gefunden.map(p => ({typ: 'p', p}));
  // Nichts Sicheres gefunden: der eigene Artikel steht oben, Enter legt genau das Getippte an
  const eigen = {typ: 'eigen', name: text};
  if (!gefunden.length || gefunden[0]._wert < 60) vsTreffer.unshift(eigen); else vsTreffer.push(eigen);
  if (vsIndex >= vsTreffer.length) vsIndex = 0;
  zeichneVorschlaege();
}
function zeichneVorschlaege(){
  const box = $('#vorschlaege');
  box.innerHTML = vsTreffer.map((t, i) => {
    const sel = `aria-selected="${i === vsIndex}"`;
    if (t.typ === 'mehrere'){
      const vorschau = t.teile.map(s => { const {text} = zerlege(s); const p = besterTreffer(text); return `${esc(text)} → ${esc(p ? p.kat : rateKat(text))}`; }).join(' · ');
      return `<button class="vs eigen" role="option" data-act="vs" data-i="${i}" ${sel}><span class="vs-n">${t.teile.length} Artikel auf einmal einsortieren<small>${vorschau}</small></span></button>`;
    }
    if (t.typ === 'eigen') return `<button class="vs eigen" role="option" data-act="vs" data-i="${i}" ${sel}><span class="vs-n">„${esc(t.name)}“ als eigenen Artikel hinzufügen<small>Gang: ${esc(rateKat(t.name))}</small></span></button>`;
    const b = preisHinweis(t.p.id);
    const rechts = b ? `${euro(b.p.preis)}<small>${b.p.ang ? '<span class="tag">Angebot</span> ' : ''}bei ${LMAP[b.l].name}</small>` : '<small>in deinen Läden nicht gelistet</small>';
    return `<button class="vs" role="option" data-act="vs" data-i="${i}" ${sel}><span class="vs-n">${esc(t.p.name)}<small>${esc(t.p.einheit)} · ${esc(t.p.kat)}</small></span><span class="vs-p">${rechts}</span></button>`;
  }).join('');
  box.hidden = false;
  const s = box.querySelector('[aria-selected="true"]'); if (s) s.scrollIntoView({block: 'nearest'});
}
function schliesseVorschlaege(){ const box = $('#vorschlaege'); if (box) box.hidden = true; }
function waehle(i){
  const t = vsTreffer[i], ein = $('#eingabe'); if (!t) return;
  if (t.typ === 'mehrere') mehrereHinzufuegen(ein.value);
  else {
    const {menge} = zerlege(ein.value);
    if (t.typ === 'p') hinzufuegen({pid: t.p.id, name: t.p.name, einheit: t.p.einheit}, menge);
    else hinzufuegen({pid: null, name: gross(t.name), einheit: ''}, menge);
  }
  ein.value = ''; vsTreffer = []; schliesseVorschlaege();
  if (!(bearbeite && bearbeite.art === 'liste')) ein.focus();
}
// Laden fuer neue Artikel: der oben gewaehlte Laden, bei "Beste Wahl" keiner (automatisch der guenstigste)
const zielLaden = () => state.modus !== 'kombi' && state.aktiv.includes(state.modus) ? state.modus : null;
// nur innerhalb von aendern() aufrufen
function neuerPosten({pid, name, einheit}, menge, laden = zielLaden()){
  const da = state.liste.find(i => !i.ok && (i.laden || null) === laden && (pid ? i.pid === pid : (!i.pid && norm(i.name) === norm(name))));
  if (da){ da.menge += menge; return {it: da, neu: false}; }
  const it = {id: uid(), pid: pid || null, name, einheit: einheit || '', menge, ok: false, preis: null, laden, kat: pid ? null : rateKat(name)};
  state.liste.push(it);
  return {it, neu: true};
}
function hinzufuegen(art, menge = 1, laden = zielLaden()){
  let r = null;
  aendern(() => { r = neuerPosten(art, menge, laden); });
  const z = R.zu[r.it.id];
  toast(`${menge > 1 ? menge + ' × ' : ''}${art.name} → ${z ? LMAP[z.l].name + ', ' : ''}${katVon(r.it)}`);
  if (r.neu && !r.it.pid && reiter === 'liste' && R.zu[r.it.id]){ bearbeite = {art: 'liste', id: r.it.id, l: R.zu[r.it.id].l}; zeichnePosten(); }
}
function mehrereHinzufuegen(text){
  const teile = text.split(/[,;\n]+/).map(s => s.trim()).filter(Boolean);
  if (!teile.length) return;
  const kats = new Set();
  aendern(() => {
    for (const t of teile){
      const {menge, text: tx} = zerlege(t);
      const p = besterTreffer(tx);
      const r = neuerPosten(p ? {pid: p.id, name: p.name, einheit: p.einheit} : {pid: null, name: gross(tx), einheit: ''}, menge);
      kats.add(katVon(r.it));
    }
  });
  toast(`${teile.length} Artikel in ${kats.size} ${kats.size === 1 ? 'Gang' : 'Gänge'} einsortiert`);
}

let angSuche = '', angLimit = 60;
const angRang = a => a.beispiel ? 2 : a.live ? 1 : 0; // eigene zuerst, dann Prospekt, dann Beispiele
function passtZurListe(a){ return state.liste.some(i => !i.ok && (a.pid ? i.pid === a.pid : norm(i.name) === norm(a.name))); }
function preisSchild(p){ const e = Math.floor(p + 1e-9), c = Math.round((p - e) * 100); return `${e > 0 ? e : '-'}.<sup>${String(c).padStart(2, '0')}</sup>`; }
function schildHTML(a, rab){
  const aufListe = state.liste.some(i => !i.ok && (a.pid ? i.pid === a.pid : norm(i.name) === norm(a.name)));
  const eigen = !a.beispiel && !a.live;
  return `<article class="schild${eigen ? ' eigen' : ''}">
    <div class="s-kopf">${dot(a.laden)}${LMAP[a.laden].name}<span class="bsp">${a.beispiel ? 'Beispiel' : a.live ? 'Prospekt' : 'Eigenes'}</span></div>
    ${rab >= 0.01 ? `<div class="rabatt">−${Math.round(rab * 100)} %</div>` : ''}
    <div class="pn">${esc(a.name)}<small>${esc(a.einheit || '')}</small></div>
    <div class="s-preis"><span class="gross">${preisSchild(a.preis)}</span>${a.alt ? `<s>${zahl(a.alt)}</s>` : ''}</div>
    <div class="s-fuss">gültig bis ${tagKurz(a.bis)}${/^https:\/\//.test(a.quelle || '') ? ` · <a href="${esc(a.quelle)}" target="_blank" rel="noopener">Quelle ↗</a>` : ''}</div>
    <div class="s-akt">
      <button class="voll" data-act="ang-liste" data-id="${esc(a.id)}" ${aufListe ? 'disabled' : ''}>${aufListe ? 'Auf der Liste' : '+ Auf die Liste'}</button>
      ${eigen ? `<button data-act="ang-weg" data-id="${esc(a.id)}">Entfernen</button>` : ''}
    </div>
  </article>`;
}
function produktAusText(v){
  const s = norm(v); if (!s) return null;
  return PRODUKTE.find(p => norm(p.name + ' · ' + p.einheit) === s) || PRODUKTE.find(p => norm(p.name) === s) || null;
}
function angebotSpeichern(){
  const fehler = $('#ang-fehler'), name = $('#ang-name').value.trim(), laden = $('#ang-laden').value;
  const preis = leseZahl($('#ang-preis').value), altEing = leseZahl($('#ang-alt').value), bis = $('#ang-bis').value || SAMSTAG_STR;
  const zeige = t => { fehler.textContent = t; fehler.hidden = false; };
  if (!name) return zeige('Bitte einen Artikel eintragen.');
  if (!preis) return zeige('Bitte den Angebotspreis eintragen, z. B. 1,49.');
  if (bis < HEUTE_STR) return zeige('Das Datum liegt in der Vergangenheit.');
  fehler.hidden = true;
  const p = produktAusText(name);
  const alt = altEing || (p ? regulaer(p.id, laden) : null);
  aendern(() => state.angebote.push({id: 'a' + uid(), laden, pid: p ? p.id : null, name: p ? p.name : name, einheit: p ? p.einheit : '', preis, alt: alt && alt > preis ? alt : null, bis}));
  $('#ang-name').value = ''; $('#ang-preis').value = ''; $('#ang-alt').value = ''; $('#ang-alt').placeholder = 'optional';
  toast('Angebot gespeichert');
}

ANSICHTEN.preise = {
  mount(){
    $('#ansicht').innerHTML = `

        </div>
        <div class="leg"><span><i style="background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)"></i>günstigster Preis</span><span><i style="box-shadow:inset 0 -2px 0 var(--deal)"></i>eigener Preis</span><span><b style="color:var(--good)">✓</b>echter Preis</span><span><b style="background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 3px;font-size:10px">B</b>vom Kassenbon</span><span><b class="mini" style="width:18px;height:18px;font-size:12px">+</b>setzt den Artikel auf die Liste</span></div>

    $('#pr-kat').addEventListener('change', e => { prKat = e.target.value; prLimit = 120; zeichneTabelle(); });
  },
  update(){
    const gesamt = PRODUKTE.length * state.aktiv.length;
    const echt = PRODUKTE.reduce((s, p) => s + state.aktiv.filter(l => istEcht(p.id, l)).length, 0);
    $('#pr-info').textContent = (echt ? `${echt} von ${gesamt} Preisen für ${PRODUKTE.length} Artikel sind echte Preise aus dem Netz oder von Kassenbons (Stand ${DATEN_INFO && DATEN_INFO.stand ? tagKurz(DATEN_INFO.stand) : 'unbekannt'}). ` : `Richtpreise für ${PRODUKTE.length} Artikel. `) +
      'Ohne echten Preis zeigt die App den Aldi-Preis: Eigenmarken wie ja!, gut & günstig, K-Classic oder Milbona kosten nachweislich überall gleich viel. Preis antippen, um ihn durch deinen zu ersetzen; ein leeres Feld stellt ihn wieder her. Wo ein Preis herkommt, zeigt der Hinweis beim Draufhalten.';
    zeichneTabelle();
  }
};
function zeichneTabelle(){
  const akt = state.aktiv;
  const liste = prSuche.trim() ? suche(prSuche, 999) : PRODUKTE;
  const gefiltert = liste.filter(p => !prKat || p.kat === prKat);
  const kopf = `<thead><tr><th>Artikel</th>${akt.map(l => `<th>${dot(l)} ${LMAP[l].name}</th>`).join('')}</tr></thead>`;
  let body = '', letzteKat = null;
  const sortiert = prSuche.trim() ? gefiltert : gefiltert.slice().sort((a, b) => KATS.indexOf(a.kat) - KATS.indexOf(b.kat));
  for (const p of sortiert.slice(0, prLimit)){
    if (!prSuche.trim() && p.kat !== letzteKat){ body += `<tr class="kat"><th colspan="${akt.length + 1}">${esc(p.kat)}</th></tr>`; letzteKat = p.kat; }
    const it = {pid: p.id, name: p.name};
    const werte = akt.map(l => ({l, x: posten(it, l)}));
    const vorhanden = werte.filter(w => !w.x.fehlt).map(w => w.x.preis);
    const min = Math.max(...vorhanden) - Math.min(...vorhanden) < 0.005 ? -1 : Math.min(...vorhanden); // alle gleich: nichts hervorheben
    const zellen = werte.map(({l, x}) => {
      if (bearbeite && bearbeite.art === 'tab' && bearbeite.pid === p.id && bearbeite.l === l)
        return `<td><input class="preis-edit" id="pt-edit" inputmode="decimal" value="${komma(regulaer(p.id, l))}" placeholder="0,00" aria-label="Preis ${esc(p.name)} bei ${LMAP[l].name}"></td>`;
      if (x.fehlt) return `<td class="nv"><button class="zelle" data-act="zelle" data-id="${p.id}" data-l="${l}" title="Preis eintragen">–</button></td>`;
      const eigen = state.preise[p.id] && state.preise[p.id][l] != null;
      return `<td class="${x.preis <= min + 1e-9 && akt.length > 1 ? 'best' : ''}"><button class="zelle${eigen ? ' eigen' : (HERKUNFT[p.id] || {})[l]?.startsWith('bon:') ? ' echt bon' : istEcht(p.id, l) ? ' echt' : ''}" data-act="zelle" data-id="${p.id}" data-l="${l}" title="${esc(eigen ? 'dein eigener Preis' : herkunftText(p.id, l))}">${zahl(x.preis)}${x.ang ? '<span class="ang">Angebot</span>' : ''}</button></td>`;
    }).join('');
    body += `<tr><td><div class="art"><button class="mini" data-act="plus-produkt" data-id="${p.id}" aria-label="${esc(p.name)} zur Liste">+</button><div>${esc(p.name)}<small>${esc(p.einheit)}${p.pfand ? ' + ' + zahl(p.pfand) + ' Pfand' : ''}</small></div></div></td>${zellen}</tr>`;
  }
  $('#pr-tabelle').innerHTML = sortiert.length ? `<table class="tab-preise">${kopf}<tbody>${body}</tbody></table>` : `<div class="leer" style="margin:0;border:0">Kein Artikel gefunden.</div>`;
  $('#pr-tabelle').insertAdjacentHTML('beforeend', sortiert.length > prLimit ? `<div class="aktionen" style="margin:10px"><button class="knopf" data-act="pr-mehr">Weitere ${Math.min(120, sortiert.length - prLimit)} zeigen (${sortiert.length - prLimit} übrig)</button></div>` : '');
  if (bearbeite && bearbeite.art === 'tab'){ const inp = $('#pt-edit'); if (inp){ inp.focus(); inp.select(); } }
}

    const eigene = Object.values(state.preise).reduce((s, o) => s + Object.keys(o).length, 0);
    $('#daten').innerHTML = `
      <p><strong>Preise vom Kassenbon.</strong> Fotografiere deinen Bon und lade das Foto hoch. Sobald Claude die Bons ausgewertet hat, sehen alle die Preise beim nächsten Öffnen der App. Das Hochladen geht nur mit dem Konto des App-Betreibers.${DATEN_INFO && DATEN_INFO.bons ? ' Zuletzt ausgewertet: Bon vom ' + tagKurz(DATEN_INFO.bons) + '.' : ''}</p>
      <div class="aktionen" style="margin-top:0"><a class="knopf haupt" href="${BON_UPLOAD}" target="_blank" rel="noopener">Kassenbon hochladen</a></div>
      <p style="margin-top:12px"><strong>Deine Daten.</strong> ${$('#sync').textContent}. Eigene Preise: ${eigene}. Eigene Angebote: ${state.angebote.length}. Eigene Laufwege: ${Object.keys(state.gangfolge).length}.</p>
      <div class="aktionen">
        ${eigene ? `<button class="knopf warn" data-act="preise-reset">Eigene Preise zurücksetzen</button>` : ''}
        ${state.angebote.length ? `<button class="knopf warn" data-act="angebote-reset">Eigene Angebote löschen</button>` : ''}
        <button class="knopf warn" data-act="alles-reset">Alles zurücksetzen</button>
      </div>`;
  }
};

/* ---------- Steuerung ---------- */
function zeigeAnsicht(){
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.id === reiter));
  if (bereitsGemountet !== reiter){ bearbeite = null; offenId = null; ANSICHTEN[reiter].mount(); bereitsGemountet = reiter; }
  aktualisiere();
}
function aktualisiere(){
  berechneAlles();
  $('#kw').textContent = `KW ${KW} · Angebote bis ${tagKurz(SAMSTAG_STR)}`;
  const n = ANGEBOTE.filter(a => state.aktiv.includes(a.laden)).length;
  $('#zahl-ang').textContent = n || '';
  $('#zahl-ang').hidden = !n;
  ANSICHTEN[reiter].update();
  zeichneLeiste();
  if (lwLaden) zeichneLaufweg();
}
let toastTimer = 0;
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('an'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('an'), 2200); }
function sicher(btn, text){
  if (btn.dataset.sicher === '1') return true;
  btn.dataset.sicher = '1'; btn.dataset.alt = btn.textContent; btn.textContent = text;
  setTimeout(() => { if (btn.isConnected){ btn.dataset.sicher = ''; btn.textContent = btn.dataset.alt; } }, 3500);
  return false;
}
const finde = id => state.liste.find(i => i.id === id);

function listeAlsText(){
  const zeilen = [];
  const st = orte(R);
  for (const l of st){
    const folge = gangfolge(l);
    const its = imLaden(l).sort((a, b) => folge.indexOf(katVon(a)) - folge.indexOf(katVon(b)));
    if (!its.length) continue;
    if (st.length > 1) zeilen.push('', `== ${LMAP[l].name} ==`);
    let letzte = null;
    for (const it of its){
      const k = katVon(it); if (k !== letzte){ zeilen.push(`-- ${k}`); letzte = k; }
      const z = R.zu[it.id];
      zeilen.push(`${it.ok ? '[x]' : '[ ]'} ${it.menge > 1 ? it.menge + ' × ' : ''}${it.name}${it.einheit ? ' (' + it.einheit + ')' : ''}: ${euro((z.p.preis + z.p.pfand) * it.menge)}`);
    }
  }
  R.fehlt.forEach(it => zeilen.push(`[ ] ${it.name}: nicht erhältlich`));
  return `Einkaufsliste KW ${KW}, bei ${ladenNamen(st)}\n${zeilen.join('\n').trim()}\nSumme ca. ${euro(R.summe)}`;
}

// Nachricht fuer WhatsApp: nur offene Artikel (alle, wenn schon alles im Wagen), nach Laden und Laufweg, *fett* und _kursiv_ nach WhatsApp-Art
function listeFuerWhatsApp(){
  const st = orte(R), zeilen = [];
  const offen = state.liste.some(it => !it.ok);
  const zeige = it => !offen || !it.ok;
  const zeile = (it, z) => `☐ ${it.menge > 1 ? it.menge + ' × ' : ''}${it.name}${it.einheit ? ' (' + it.einheit + ')' : ''}${z ? ' – ' + euro((z.p.preis + z.p.pfand) * it.menge) + (z.p.ang ? ' Angebot' : '') : ''}`;
  let summe = 0;
  for (const l of st){
    const folge = gangfolge(l);
    const its = imLaden(l).filter(zeige).sort((a, b) => folge.indexOf(katVon(a)) - folge.indexOf(katVon(b)));
    if (!its.length) continue;
    const s = summeVon(its); summe += s;
    zeilen.push('', `*${LMAP[l].name}*${st.length > 1 ? ' (ca. ' + euro(s) + ')' : ''}`);
    let letzte = null;
    for (const it of its){
      const k = katVon(it);
      if (k !== letzte){ zeilen.push(`_${k}_`); letzte = k; }
      zeilen.push(zeile(it, R.zu[it.id]));
    }
  }
  const rest = R.fehlt.filter(zeige);
  if (rest.length){ zeilen.push('', '*Woanders besorgen*'); rest.forEach(it => zeilen.push(zeile(it, null))); }
  return [`🛒 *Einkaufsliste KW ${KW}*`, `Summe ca. *${euro(summe)}* bei ${ladenNamen(st)}`, ...zeilen, '', `Wochenkorb: ${APP_URL}`].join('\n');
}

function preisUebernehmen(inp){
  if (!bearbeite) return;
  const b = bearbeite; bearbeite = null;
  const v = inp.value.trim() === '' ? null : leseZahl(inp.value);
  if (b.art === 'liste'){
    const it = finde(b.id);
    if (it){
      if (it.pid && PMAP[it.pid]) aendern(() => setzePreis(it.pid, b.l, v));
      else aendern(() => { it.preis = v; });
      return;
    }
  } else if (b.art === 'tab'){ aendern(() => setzePreis(b.pid, b.l, v)); return; }
  aktualisiere();
}
function setzePreis(pid, l, v){
  if (!state.preise[pid]) state.preise[pid] = {};
  if (v == null || v === SCHAETZ[pid][l]) delete state.preise[pid][l]; else state.preise[pid][l] = v;
  if (!Object.keys(state.preise[pid]).length) delete state.preise[pid];
}
function schiebeGang(kat, richtung){
  const f = gangfolge(lwLaden), i = f.indexOf(kat), j = i + richtung;
  if (i < 0 || j < 0 || j >= f.length) return;
  [f[i], f[j]] = [f[j], f[i]];
  setzeGangfolge(lwLaden, f);
  const btn = document.querySelector(`#lw-liste li[data-kat="${CSS.escape(kat)}"] [data-act="${richtung < 0 ? 'lw-hoch' : 'lw-runter'}"]`);
  if (btn && !btn.disabled) btn.focus();
}
function hakenGesetzt(it){
  const z = R.zu[it.id]; if (!z) return;
  const l = z.l, st = R.stationen;
  if (!imLaden(l).every(x => x.ok)) return;
  if (st.length < 2){ toast('Alles im Wagen'); return; }
  const weiter = st.find(s => s !== l && imLaden(s).some(x => !x.ok));
  toast(weiter ? `${LMAP[l].name} erledigt. Weiter zu ${LMAP[weiter].name}` : 'Tour erledigt, alles im Wagen');
  if (tourFilter === l){ tourFilter = weiter || 'alle'; zeichnePosten(); }
}

document.addEventListener('click', e => {
  if (e.target.id === 'overlay'){ schliesseLaufweg(); return; }
  const b = e.target.closest('[data-act]');
  if (!e.target.closest('.suche')) schliesseVorschlaege();
  if (!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.id;
  switch (act){
    case 'tab': reiter = id; try { localStorage.setItem('wochenkorb.reiter', id); } catch (x) {} zeigeAnsicht(); window.scrollTo({top: 0}); break;
    case 'modus': aendern(() => { state.modus = id; }); break;
    case 'vs': waehle(+b.dataset.i); break;
    case 'ok': { const it = finde(id); if (!it) break; aendern(() => { it.ok = !it.ok; }); if (it.ok) hakenGesetzt(it); break; }
    case 'plus': aendern(() => { const it = finde(id); if (it) it.menge++; }); break;
    case 'minus': aendern(() => { const it = finde(id); if (!it) return; if (it.menge > 1) it.menge--; else state.liste = state.liste.filter(x => x !== it); }); break;
    case 'details': offenId = offenId === id ? null : id; zeichnePosten(); break;
    case 'entfernen': offenId = null; aendern(() => { state.liste = state.liste.filter(x => x.id !== id); }); break;
    case 'preis': bearbeite = {art: 'liste', id, l: b.dataset.l}; zeichnePosten(); break;
    case 'zelle': bearbeite = {art: 'tab', pid: id, l: b.dataset.l}; zeichneTabelle(); break;
    case 'plus-produkt': { const p = PMAP[id]; hinzufuegen({pid: p.id, name: p.name, einheit: p.einheit}); break; }
    case 'tour-filter': tourFilter = id; zeichnePosten(); break;
    case 'aufklappen': aufgeklappt.add(id); zeichnePosten(); break;
    case 'tour-hoch': case 'tour-runter': {
      const st = R.stationen.slice(), i = st.indexOf(id), j = act === 'tour-hoch' ? i - 1 : i + 1;
      if (i < 0 || j < 0 || j >= st.length) break;
      [st[i], st[j]] = [st[j], st[i]];
      aendern(() => { state.tour = [...st, ...state.tour.filter(l => !st.includes(l))]; });
      break;
    }
    case 'laufweg': oeffneLaufweg(id); break;
    case 'lw-hoch': schiebeGang(id, -1); break;
    case 'lw-runter': schiebeGang(id, 1); break;
    case 'lw-standard': aendern(() => { delete state.gangfolge[lwLaden]; }); toast('Standard-Laufweg wiederhergestellt'); break;
    case 'lw-alle': { const f = gangfolge(lwLaden); aendern(() => { LAEDEN.forEach(l => { state.gangfolge[l.id] = f.slice(); }); }); toast('Laufweg für alle Läden übernommen'); break; }
    case 'lw-zu': schliesseLaufweg(); break;
    case 'beispiel-leeren': aendern(() => { state.liste = []; state.beispielListe = false; }); $('#eingabe') && $('#eingabe').focus(); break;
    case 'beispiel-behalten': aendern(() => { state.beispielListe = false; }); break;
    case 'erledigte': aendern(() => { state.liste = state.liste.filter(i => !i.ok); }); break;
    case 'leeren': if (sicher(b, 'Wirklich leeren?')) aendern(() => { state.liste = []; state.beispielListe = false; }); break;
    case 'whatsapp':
      // In der Android-App direkt an WhatsApp uebergeben, sonst oeffnet der Link wa.me
      if (window.WochenkorbApp && typeof window.WochenkorbApp.teilen === 'function'){ e.preventDefault(); window.WochenkorbApp.teilen(listeFuerWhatsApp()); }
      else b.href = whatsappLink();
      break;
    case 'kopieren': {
      const text = listeAlsText();
      const zeigeFeld = () => { const t = document.createElement('textarea'); t.className = 'kopiertext'; t.readOnly = true; t.value = text; $('#aktionen').appendChild(t); t.select(); };
      try { navigator.clipboard.writeText(text).then(() => toast('Liste kopiert, sortiert nach Laufweg'), zeigeFeld); } catch (x) { zeigeFeld(); }
      break;
    }
    case 'zumbon':
      if (reiter !== 'liste'){ reiter = 'liste'; zeigeAnsicht(); }
      $('#bon').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start'});
      break;
    case 'ang-filter': angFilter = id; angLimit = 60; aktualisiere(); break;
    case 'ang-mehr': angLimit += 60; aktualisiere(); break;
    case 'pr-mehr': prLimit += 120; zeichneTabelle(); break;
    case 'ang-liste': { const a = ANGEBOTE.find(x => x.id === id); if (a) hinzufuegen({pid: a.pid, name: a.name, einheit: a.einheit}, 1, a.laden); break; }
    case 'ang-weg': aendern(() => { state.angebote = state.angebote.filter(a => a.id !== id); }); break;
    case 'bsp-aus': aendern(() => { state.beispieleAus = true; }); break;
    case 'bsp-an': aendern(() => { state.beispieleAus = false; }); break;
    case 'laden-an':
      if (state.aktiv.includes(id) && state.aktiv.length === 1){ toast('Mindestens ein Laden muss aktiv bleiben'); break; }
      aendern(() => { state.aktiv = state.aktiv.includes(id) ? state.aktiv.filter(x => x !== id) : LAEDEN.map(l => l.id).filter(x => x === id || state.aktiv.includes(x)); });
      break;
    case 'preise-reset': if (sicher(b, 'Wirklich zurücksetzen?')) aendern(() => { state.preise = {}; }); break;
    case 'angebote-reset': if (sicher(b, 'Wirklich löschen?')) aendern(() => { state.angebote = []; }); break;
    case 'alles-reset': if (sicher(b, 'Alles löschen?')) aendern(() => { const n = neuerZustand(); n.liste = []; n.beispielListe = false; state = n; }); break;
  }
});
document.addEventListener('change', e => {
  const s = e.target.closest && e.target.closest('select[data-feld]');
  if (!s) return;
  const it = finde(s.dataset.id); if (!it) return;
  if (s.dataset.feld === 'kat'){
    const std = it.pid && PMAP[it.pid] ? PMAP[it.pid].kat : null;
    aendern(() => { it.kat = s.value === std ? null : s.value; });
    toast(`${it.name} → ${s.value}`);
  } else {
    aendern(() => { it.laden = s.value || null; });
    toast(s.value ? `${it.name} kaufst du jetzt bei ${LMAP[s.value].name}` : `${it.name} wieder automatisch zugeordnet`);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && lwLaden){ schliesseLaufweg(); return; }
  if (!e.target.classList || !e.target.classList.contains('preis-edit')) return;
  if (e.key === 'Enter'){ e.preventDefault(); preisUebernehmen(e.target); }
  else if (e.key === 'Escape'){ bearbeite = null; aktualisiere(); }
});
document.addEventListener('focusout', e => {
  if (e.target.classList && e.target.classList.contains('preis-edit')) preisUebernehmen(e.target);
});

async function datenLaden(){
  try {
    const r = await fetch('daten/preise.json', {cache: 'no-cache'});
    if (!r.ok) return;
    const d = await r.json();
    ECHT = d.preise && typeof d.preise === 'object' ? d.preise : {};
    HERKUNFT = d.herkunft && typeof d.herkunft === 'object' ? d.herkunft : {};
    LIVE = (Array.isArray(d.angebote) ? d.angebote : []).filter(a => a && LMAP[a.laden] && a.preis > 0 && a.name).map((a, i) => ({
      id: 'live-' + i, laden: a.laden, pid: a.pid && PMAP[a.pid] ? a.pid : null, name: a.name, einheit: a.einheit || a.menge || '',
      preis: a.preis, alt: a.alt > a.preis ? a.alt : null, ab: a.ab || null, bis: a.bis || SAMSTAG_STR, quelle: a.quelle || '', live: true}));
    DATEN_INFO = {stand: d.stand || '', bons: d.bons_stand || null, anzahl: Object.values(ECHT).reduce((s, o) => s + Object.keys(o).length, 0)};
    berechneSchaetzungen();
    aktualisiere();
  } catch (e) { /* ohne Datendatei (lokal geoeffnet) rechnet die App mit Richtpreisen */ }
}

zeigeAnsicht();
datenLaden();
syncStarten();
if ('serviceWorker' in navigator && /^(https:|http:\/\/localhost)/.test(location.href) && !/claude/.test(location.hostname))
  navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
